name: goflow

x-goflow-image: &goflow-image
  build: .
  image: goflow:local

x-goflow-env: &goflow-env
  GOFLOW_DATABASE_URL: postgres://goflow:goflow@postgres:5432/goflow?sslmode=disable
  GOFLOW_LOG_LEVEL: info
  GOFLOW_EXAMPLE_HANDLERS: "true"
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: goflow
      POSTGRES_PASSWORD: goflow
      POSTGRES_DB: goflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goflow -d goflow"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *goflow-image
    command: ["migrate"]
    environment: *goflow-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *goflow-image
    command: ["serve"]
    environment: *goflow-env
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/goflow", "probe", "http://127.0.0.1:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Scale horizontally with: docker compose up -d --scale worker=3
  worker:
    <<: *goflow-image
    command: ["worker"]
    environment:
      <<: *goflow-env
      GOFLOW_WORKER_CONCURRENCY: "16"
      GOFLOW_METRICS_ADDR: ":9090"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/goflow", "probe", "http://127.0.0.1:9090/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    stop_grace_period: 40s
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deployments/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deployments/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployments/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
