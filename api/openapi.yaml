openapi: 3.1.0
info:
  title: GoFlow API
  version: 1.0.0
  description: |
    Workflow orchestration engine. Workflows are versioned DAGs of steps executed by
    registered handlers; executions are durable, retried with backoff and compensated
    (saga) on failure.

    **Authentication**: every `/api/v1` route requires `Authorization: Bearer <api key>`.
    Keys belong to one tenant and carry permissions; data of other tenants is never visible
    (requests for it return 404).

    **Idempotency**: any `POST` accepts an `Idempotency-Key` header. The first non-5xx
    response is stored for 24h and replayed (with `Idempotent-Replayed: true`) for repeats
    with the same body; reusing a key with a different body returns 422, and a repeat while
    the first request is still running returns 409. For `POST /executions` the key also
    deduplicates executions at the database level.

    **Errors** use RFC 9457 problem details (`application/problem+json`).

    **Rate limiting**: token bucket per tenant (per client IP when unauthenticated);
    exceeding it returns 429 with `Retry-After`.
servers:
  - url: http://localhost:8080
security:
  - apiKey: []
tags:
  - name: Workflows
  - name: Executions
  - name: Tasks
  - name: Operations

paths:
  /api/v1/workflows:
    post:
      tags: [Workflows]
      summary: Create a workflow with a first draft version
      operationId: createWorkflow
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWorkflowRequest" }
      responses:
        "201":
          description: Created
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workflow" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    get:
      tags: [Workflows]
      summary: List workflow definitions (newest first)
      operationId: listWorkflows
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of workflows
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/WorkflowSummary" }
                  next_cursor: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/workflows/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Workflows]
      summary: Get a workflow with all its versions
      operationId: getWorkflow
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workflow" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Workflows]
      summary: Update the description and/or the spec of the current draft
      description: Published versions are immutable; returns 409 when there is no draft.
      operationId: updateWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                description: { type: string, maxLength: 2000 }
                spec: { $ref: "#/components/schemas/Spec" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workflow" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/workflows/{id}/versions:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Workflows]
      summary: Open a new draft version
      description: Copies the latest spec when no spec is given. Only one draft may exist.
      operationId: createVersion
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                spec: { $ref: "#/components/schemas/Spec" }
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/workflows/{id}/publish:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Workflows]
      summary: Publish the draft version
      description: Fails with 422 if a referenced handler is not registered by any worker.
      operationId: publishWorkflow
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200":
          description: Published version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/executions:
    post:
      tags: [Executions]
      summary: Start (or schedule) an execution
      description: |
        Binds the execution to the latest published version, or to `version` when given.
        With `scheduled_at` in the future the execution stays PENDING until then.
        Returns 200 instead of 201 when an execution with the same Idempotency-Key exists.
      operationId: startExecution
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartExecutionRequest" }
      responses:
        "201":
          description: Created
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Execution" }
        "200":
          description: Existing execution for this Idempotency-Key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Execution" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    get:
      tags: [Executions]
      summary: List executions (newest first)
      operationId: listExecutions
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ExecutionStatus" }
        - name: workflow_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: A page of executions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Execution" }
                  next_cursor: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/executions/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Executions]
      summary: Get an execution (status, result, error)
      operationId: getExecution
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Execution" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/executions/{id}/history:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Executions]
      summary: Every state transition of the execution and its tasks, oldest first
      operationId: executionHistory
      parameters:
        - name: after
          in: query
          description: Return events with an id greater than this (use next_cursor).
          schema: { type: integer, format: int64, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
                  next_cursor: { type: string, description: Value for `after` to read the next page. }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/executions/{id}/tasks:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Tasks]
      summary: Tasks of an execution (actions, then compensations)
      operationId: executionTasks
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/executions/{id}/cancel:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Executions]
      summary: Cancel an execution
      description: |
        Running tasks are fenced (their results are discarded) and their handlers' contexts are
        cancelled at the next heartbeat. With `compensate: true` completed steps are compensated
        first and the execution ends COMPENSATED. Not allowed while COMPENSATING.
      operationId: cancelExecution
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 500 }
                compensate: { type: boolean, default: false }
      responses:
        "200":
          description: Cancelled (or compensating)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Execution" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/executions/{id}/pause:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Executions]
      summary: Pause an execution
      description: In-flight tasks finish and their results are recorded; no new task is started until resume.
      operationId: pauseExecution
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200":
          description: Paused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Execution" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/executions/{id}/resume:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Executions]
      summary: Resume a paused execution
      operationId: resumeExecution
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200":
          description: Resumed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Execution" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/tasks/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Tasks]
      summary: Get a task
      operationId: getTask
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/tasks/{id}/attempts:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Tasks]
      summary: Attempt history of a task
      operationId: taskAttempts
      responses:
        "200":
          description: Attempts, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Attempt" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/dead-letters:
    get:
      tags: [Tasks]
      summary: Dead letter queue (tasks that failed permanently or exhausted retries)
      operationId: listDeadLetters
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of dead letters
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DeadLetter" }
                  next_cursor: { type: string }

  /health:
    get:
      tags: [Operations]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
  /ready:
    get:
      tags: [Operations]
      summary: Readiness probe (database reachable and migrations applied)
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
        "503":
          description: Not ready
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string }, reason: { type: string } } }
  /metrics:
    get:
      tags: [Operations]
      summary: Prometheus metrics
      security: []
      responses:
        "200":
          description: Prometheus text exposition format
          content:
            text/plain: { schema: { type: string } }

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: API key created with `goflow apikey create` (format `gf_...`).

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: Opaque keyset cursor from a previous page's next_cursor.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string, maxLength: 255 }

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    Forbidden:
      description: API key lacks the required permission
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    NotFound:
      description: Resource does not exist or belongs to another tenant
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    Conflict:
      description: Operation not allowed in the current state, or duplicate resource
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    ValidationFailed:
      description: Workflow spec is invalid, or Idempotency-Key reused with another body
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    PayloadTooLarge:
      description: Request body exceeds the configured limit
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json: { schema: { $ref: "#/components/schemas/Problem" } }

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, examples: [validation-error] }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors: { type: array, items: { type: string } }
        correlation_id: { type: string }

    Duration:
      type: string
      description: Go duration string.
      examples: ["30s", "500ms", "5m"]

    RetryPolicy:
      type: object
      required: [max_attempts]
      properties:
        max_attempts: { type: integer, minimum: 1, maximum: 100, description: Total attempts including the first. }
        initial_interval: { $ref: "#/components/schemas/Duration" }
        max_interval: { $ref: "#/components/schemas/Duration" }
        multiplier: { type: number, minimum: 1, default: 2 }
        jitter: { type: number, minimum: 0, maximum: 1, description: Fraction of the delay randomized (±). }

    Compensation:
      type: object
      required: [handler]
      properties:
        handler: { type: string, pattern: "^[a-z][a-z0-9_.-]{0,127}$" }
        timeout: { $ref: "#/components/schemas/Duration" }
        retry: { $ref: "#/components/schemas/RetryPolicy" }

    Step:
      type: object
      required: [key, handler]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_-]{0,63}$" }
        name: { type: string }
        handler: { type: string, pattern: "^[a-z][a-z0-9_.-]{0,127}$" }
        depends_on: { type: array, items: { type: string } }
        params: { description: Static JSON passed to the handler (max 64 KiB). }
        timeout: { $ref: "#/components/schemas/Duration" }
        retry: { $ref: "#/components/schemas/RetryPolicy" }
        compensation: { $ref: "#/components/schemas/Compensation" }

    Spec:
      type: object
      required: [steps]
      description: A DAG of 1-100 steps; cycles, unknown or duplicate dependencies are rejected.
      properties:
        steps:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/Step" }
        settings:
          type: object
          properties:
            max_parallelism: { type: integer, minimum: 0, description: 0 means unlimited. }
            default_timeout: { $ref: "#/components/schemas/Duration" }
            default_retry: { $ref: "#/components/schemas/RetryPolicy" }

    CreateWorkflowRequest:
      type: object
      required: [name, spec]
      additionalProperties: false
      properties:
        name: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9 _.-]{0,127}$" }
        description: { type: string, maxLength: 2000 }
        spec: { $ref: "#/components/schemas/Spec" }

    Version:
      type: object
      required: [id, number, status, spec, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer }
        status: { type: string, enum: [DRAFT, PUBLISHED] }
        spec: { $ref: "#/components/schemas/Spec" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }

    WorkflowSummary:
      type: object
      required: [id, name, description, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Workflow:
      allOf:
        - $ref: "#/components/schemas/WorkflowSummary"
        - type: object
          required: [latest_version, versions]
          properties:
            latest_version: { type: integer }
            latest_published_version: { type: integer }
            versions: { type: array, items: { $ref: "#/components/schemas/Version" } }

    StartExecutionRequest:
      type: object
      required: [workflow_id]
      additionalProperties: false
      properties:
        workflow_id: { type: string, format: uuid }
        version: { type: integer, description: Published version to run; defaults to the latest. }
        input: { type: object, description: JSON object (max 256 KiB) available to every step. }
        scheduled_at: { type: string, format: date-time, description: Start no earlier than this (max one year ahead). }

    ExecutionStatus:
      type: string
      enum: [PENDING, RUNNING, WAITING, PAUSED, COMPLETED, FAILED, CANCELLED, COMPENSATING, COMPENSATED]

    Execution:
      type: object
      required: [id, workflow_id, workflow_name, version, status, input, scheduled_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        workflow_id: { type: string, format: uuid }
        workflow_name: { type: string }
        version: { type: integer }
        status: { $ref: "#/components/schemas/ExecutionStatus" }
        input: { type: object }
        output: { type: object, description: Map of step key to step output (COMPLETED only). }
        error: { type: string }
        scheduled_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }

    Task:
      type: object
      required: [id, execution_id, step_key, name, handler, kind, status, depends_on, attempts, retry, timeout, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        execution_id: { type: string, format: uuid }
        step_key: { type: string }
        name: { type: string }
        handler: { type: string }
        kind: { type: string, enum: [ACTION, COMPENSATION] }
        status: { type: string, enum: [PENDING, READY, RUNNING, RETRY_SCHEDULED, COMPLETED, FAILED, CANCELLED, SKIPPED, COMPENSATED] }
        depends_on: { type: array, items: { type: string } }
        input: { type: object, description: Envelope with workflow_input, params, dependencies and compensated_output. }
        output: {}
        attempts: { type: integer }
        retry: { $ref: "#/components/schemas/RetryPolicy" }
        timeout: { $ref: "#/components/schemas/Duration" }
        compensation:
          type: object
          properties:
            handler: { type: string }
            timeout: { $ref: "#/components/schemas/Duration" }
            retry: { $ref: "#/components/schemas/RetryPolicy" }
        compensates_task_id: { type: string, format: uuid }
        next_run_at: { type: string, format: date-time, description: Set for READY and RETRY_SCHEDULED tasks. }
        last_error: { type: string }
        last_error_kind: { $ref: "#/components/schemas/ErrorKind" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }

    ErrorKind:
      type: string
      enum: [RETRYABLE, PERMANENT, TIMEOUT, PANIC, LEASE_EXPIRED, WORKER_SHUTDOWN]

    Attempt:
      type: object
      required: [number, worker_id, status, started_at]
      properties:
        number: { type: integer }
        worker_id: { type: string }
        status: { type: string, enum: [RUNNING, SUCCEEDED, FAILED, CANCELLED] }
        error: { type: string }
        error_kind: { $ref: "#/components/schemas/ErrorKind" }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        duration_ms: { type: integer }

    Event:
      type: object
      required: [id, type, created_at]
      properties:
        id: { type: integer, format: int64 }
        type:
          type: string
          enum: [execution.created, execution.status_changed, task.status_changed, task.started, task.dead_lettered]
        task_id: { type: string, format: uuid }
        step_key: { type: string }
        from: { type: string }
        to: { type: string }
        message: { type: string }
        created_at: { type: string, format: date-time }

    DeadLetter:
      type: object
      required: [id, execution_id, task_id, step_key, handler, kind, attempts, error, error_kind, created_at]
      properties:
        id: { type: string, format: uuid }
        execution_id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        step_key: { type: string }
        handler: { type: string }
        kind: { type: string, enum: [ACTION, COMPENSATION] }
        attempts: { type: integer }
        error: { type: string }
        error_kind: { $ref: "#/components/schemas/ErrorKind" }
        created_at: { type: string, format: date-time }
